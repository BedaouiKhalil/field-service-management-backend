services:
    app:
        build:
            context: .
            target: dev
        volumes:
            - .:/var/www
        depends_on:
            - db

    nginx:
        image: nginx:alpine
        ports:
            - "8080:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

    db:
        image: mysql:8
        environment:
            MYSQL_DATABASE: p_field_service_management
            MYSQL_ROOT_PASSWORD: secret
        ports:
            - "127.0.0.1:3307:3306"
        volumes:
            - dbdata:/var/lib/mysql

    node:
        image: node:20-alpine
        working_dir: /var/www
        volumes:
            - .:/var/www
        command: sh -c "npm install && npm run dev -- --host"
        ports:
            - "5173:5173"

volumes:
    dbdata:
